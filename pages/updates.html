<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更新日志 - LIONCC.AI</title>
<meta name="description" content="LIONCC.AI 更新日志：记录网站的每次更新。">
<link rel="canonical" href="https://lioncc.ai/pages/updates.html">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai:wght@400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"LXGW WenKai","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#fcfcfc;color:#111827;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:56px 24px 80px}
.logo{display:inline-block;margin-bottom:40px}
.logo img{height:52px;width:auto;display:block}
h1{font-size:44px;font-weight:900;letter-spacing:-0.02em;margin-bottom:12px}
.sub{font-size:16px;color:#6b7280;margin-bottom:48px;line-height:1.8}
.entry{
  background:#fff;border:1px solid #e5e7eb;border-radius:16px;
  padding:28px;margin-bottom:24px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.entry-date{
  display:inline-block;font-size:12px;font-weight:700;color:#6b7280;
  background:#f3f4f6;border-radius:999px;padding:4px 12px;margin-bottom:12px;
}
.entry h2{font-size:22px;font-weight:800;margin-bottom:10px}
.entry p.desc{font-size:15px;line-height:1.8;color:#4b5563;margin-bottom:16px}
.entry ul{list-style:none}
.entry li{font-size:14px;line-height:1.8;color:#4b5563;padding-left:4px;margin-bottom:8px}
.entry li:last-child{margin-bottom:0}
.back{display:inline-block;margin-top:16px;font-size:14px;color:#6b7280;text-decoration:none}
.back:hover{color:#111827}
.foot{margin-top:64px;padding-top:24px;border-top:1px solid #e5e7eb;font-size:12px;color:#9ca3af;text-align:center;letter-spacing:.08em}
@media (max-width:480px){
  h1{font-size:32px}
  .entry{padding:20px}
  .logo img{height:42px}
}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="/" aria-label="LIONCC.AI 首页">
    <img src="/images/banner.png" alt="LIONCC.AI">
  </a>
  <h1>更新日志</h1>
  <p class="sub">记录 LIONCC.AI 的每次更新。</p>

  <div class="entry">
    <span class="entry-date">2026-10-09</span>
    <h2>404 页面更聪明了 🧭</h2>
    <p class="desc">404 页面不再是死胡同。走错地址时可以直接站内搜索，输错的工具名会自动联想；从微信复制的多行网址被粘成一条时，会自动拆分并提供复制、打开按钮。</p>
    <ul>
      <li>🔗 粘连网址识别：微信等客户端复制多行网址粘在一起时，自动拆分并提供复制、打开按钮</li>
      <li>🎨 风格对齐网站整体：纯白底、超大深色标题、深色主按钮加描边次按钮</li>
      <li>🔘 保留返回首页与产品矩阵两个入口</li>
    </ul>
  </div>

  <a class="back" href="/">← 返回首页</a>
  <div class="foot">LIONCC.AI</div>
</div>
</body>
</html>
