<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 404 - LIONCC.AI</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#ffffff;color:#111827;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  text-align:center;padding:48px 24px;max-width:600px;width:100%;
}
.logo{
  display:inline-block;margin-bottom:32px;
}
.logo img{height:56px;width:auto;display:block}
.code{
  font-size:128px;font-weight:900;letter-spacing:-0.05em;
  color:#111827;line-height:1;margin-bottom:16px;
}
.title{
  font-size:30px;font-weight:800;margin-bottom:12px;color:#111827;
  letter-spacing:-0.01em;
}
.desc{
  font-size:16px;line-height:1.8;color:#6b7280;margin-bottom:36px;
}
.actions{
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:14px 30px;border-radius:12px;
  font-size:16px;font-weight:700;text-decoration:none;
  transition:all .3s ease;min-height:52px;
}
.btn-primary{
  background:#111827;color:#fff;
  box-shadow:0 4px 8px rgba(0,0,0,.2);
}
.btn-primary:hover{transform:scale(1.02);background:#1f2937}
.btn-secondary{
  background:#fff;color:#111827;border:1px solid #e5e7eb;
}
.btn-secondary:hover{border-color:#111827}
.brand{
  margin-top:56px;font-size:12px;color:#9ca3af;letter-spacing:0.08em;
}
.brand a{color:inherit;text-decoration:none;font-weight:700}
.brand a:hover{color:#111827}
/* 粘连网址识别面板 */
.glued{
  display:none;text-align:left;margin-top:36px;
  border:1px solid #e5e7eb;background:#f9fafb;
  border-radius:16px;padding:24px;
}
.glued.show{display:block}
.glued h2{
  font-size:16px;font-weight:800;color:#111827;margin-bottom:8px;
}
.glued p{
  font-size:13px;line-height:1.7;color:#6b7280;margin-bottom:16px;
}
.glued .row{
  display:flex;align-items:center;gap:8px;
  background:#fff;border:1px solid #e5e7eb;border-radius:10px;
  padding:10px 12px;margin-bottom:8px;
}
.glued .row:last-child{margin-bottom:0}
.glued .url{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#111827;
}
.glued .mini{
  flex-shrink:0;font-size:12px;font-weight:700;
  padding:8px 14px;border-radius:8px;cursor:pointer;
  border:1px solid #e5e7eb;background:#fff;color:#111827;text-decoration:none;
  transition:all .2s ease;
}
.glued .mini:hover{border-color:#111827}
.glued .mini.go{background:#111827;color:#fff;border-color:#111827}
.glued .mini.go:hover{background:#1f2937}
@media (max-width:480px){
  .code{font-size:88px}
  .title{font-size:24px}
  .logo img{height:44px}
  .btn{padding:12px 24px;font-size:15px;min-height:48px}
}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="/" aria-label="LIONCC.AI 首页">
    <img src="/images/banner.png" alt="LIONCC.AI">
  </a>
  <div class="code">404</div>
  <h1 class="title">这个页面不存在</h1>
  <p class="desc">你访问的链接可能已被移动、删除，或地址输入有误。<br>回到首页继续浏览，或直接前往产品矩阵。</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">返回首页</a>
    <a class="btn btn-secondary" href="/#products">产品矩阵</a>
  </div>
  <div class="glued" id="gluedPanel">
    <h2>这个网址看起来是多条网址粘在了一起</h2>
    <p>从微信等客户端复制多行网址时，相邻两行容易被粘成一条，导致打不开。这不是我们给错了地址，把下面拆开后的网址单独打开就行。</p>
    <div id="gluedList"></div>
  </div>
  <div class="brand"><a href="/">LIONCC.AI</a></div>
</div>
<script>
(function(){
  // 识别地址栏里粘连在一起的多条网址（思路来源：@gefei55）
  // 注意：浏览器/网关会把地址栏里的 // 压成 /，所以单斜杠和双斜杠都要认
  var raw = location.pathname + location.search + location.hash;
  var decoded = raw;
  try { decoded = decodeURIComponent(raw); } catch (e) {}
  var matches = decoded.match(/https?:\/{1,2}(?:(?!https?:\/{1,2})[^\s"'<>\]])+/gi) || [];
  var seen = {};
  var urls = [];
  matches.forEach(function(u){
    u = u.replace(/^(https?:\/)(?!\/)/i, '$1/').replace(/[.,;!?]+$/, '');
    if (!seen[u]) { seen[u] = 1; urls.push(u); }
  });
  if (urls.length < 2) return;
  var list = document.getElementById('gluedList');
  urls.forEach(function(u){
    var row = document.createElement('div');
    row.className = 'row';
    var span = document.createElement('span');
    span.className = 'url';
    span.textContent = u;
    var copy = document.createElement('button');
    copy.className = 'mini';
    copy.textContent = '复制';
    copy.onclick = function(){
      function done(){ copy.textContent = '已复制'; setTimeout(function(){ copy.textContent = '复制'; }, 1500); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(u).then(done, done);
      } else {
        var ta = document.createElement('textarea');
        ta.value = u; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta); done();
      }
    };
    var go = document.createElement('a');
    go.className = 'mini go';
    go.textContent = '打开';
    go.href = u; go.target = '_blank'; go.rel = 'noopener noreferrer';
    row.appendChild(span); row.appendChild(copy); row.appendChild(go);
    list.appendChild(row);
  });
  document.getElementById('gluedPanel').classList.add('show');
})();
</script>
</body>
</html>
