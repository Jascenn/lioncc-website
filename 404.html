<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 404 - LIONCC.AI</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#fafafa;color:#1a1a1a;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  text-align:center;padding:48px 24px;max-width:560px;width:100%;
}
.code{
  font-size:96px;font-weight:800;letter-spacing:-0.04em;
  color:#1a1a1a;line-height:1;margin-bottom:8px;
}
.title{
  font-size:24px;font-weight:700;margin-bottom:12px;color:#1a1a1a;
}
.desc{
  font-size:15px;line-height:1.7;color:#6b6b6b;margin-bottom:32px;
}
.actions{
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:11px 22px;border-radius:8px;
  font-size:14px;font-weight:600;text-decoration:none;
  transition:all .2s ease;min-height:44px;
}
.btn-primary{background:#1a1a1a;color:#fff;}
.btn-primary:hover{background:#333;}
.btn-secondary{background:#fff;color:#1a1a1a;border:1px solid #d4d4d4;}
.btn-secondary:hover{border-color:#9a9a9a;}
.brand{
  margin-top:48px;font-size:12px;color:#9a9a9a;letter-spacing:0.04em;
}
.brand a{color:inherit;text-decoration:none}
.brand a:hover{color:#1a1a1a}
/* 粘连网址识别面板 */
.glued{
  display:none;text-align:left;margin-top:32px;
  border:1px solid #f0d9a8;background:#fffaf0;
  border-radius:12px;padding:20px;
}
.glued.show{display:block}
.glued h2{font-size:15px;font-weight:700;margin-bottom:8px;color:#1a1a1a}
.glued p{font-size:13px;line-height:1.7;color:#6b6b6b;margin-bottom:12px}
.glued .row{
  display:flex;align-items:center;gap:8px;
  background:#fff;border:1px solid #e8e0cf;border-radius:8px;
  padding:8px 10px;margin-bottom:8px;
}
.glued .row:last-child{margin-bottom:0}
.glued .url{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#1a1a1a;
}
.glued .mini{
  flex-shrink:0;font-size:12px;font-weight:600;
  padding:6px 10px;border-radius:6px;cursor:pointer;
  border:1px solid #d4d4d4;background:#fff;color:#1a1a1a;text-decoration:none;
}
.glued .mini:hover{border-color:#9a9a9a}
.glued .mini.go{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
@media (max-width:480px){
  .code{font-size:72px}
  .title{font-size:20px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1 class="title">这个页面不存在</h1>
  <p class="desc">你访问的链接可能已被移动、删除，或地址输入有误。<br>回到首页继续浏览，或直接前往产品矩阵。</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">返回首页</a>
    <a class="btn btn-secondary" href="/#products">产品矩阵</a>
  </div>
  <div class="glued" id="gluedPanel">
    <h2>这个网址看起来是多条网址粘在了一起</h2>
    <p>从微信等客户端复制多行网址时，相邻两行容易被粘成一条，导致打不开。这不是我们给错了地址，把下面拆开后的网址单独打开就行。</p>
    <div id="gluedList"></div>
  </div>
  <div class="brand"><a href="/">LIONCC.AI</a></div>
</div>
<script>
(function(){
  // 识别地址栏里粘连在一起的多条网址（思路来源：@gefei55）
  var raw = location.pathname + location.search + location.hash;
  var decoded = raw;
  try { decoded = decodeURIComponent(raw); } catch (e) {}
  var matches = decoded.match(/https?:\/\/[^\s"'<>\]]+/gi) || [];
  var seen = {};
  var urls = [];
  matches.forEach(function(u){
    u = u.replace(/[.,;!?]+$/, '');
    if (!seen[u]) { seen[u] = 1; urls.push(u); }
  });
  if (urls.length < 2) return;
  var list = document.getElementById('gluedList');
  urls.forEach(function(u){
    var row = document.createElement('div');
    row.className = 'row';
    var span = document.createElement('span');
    span.className = 'url';
    span.textContent = u;
    var copy = document.createElement('button');
    copy.className = 'mini';
    copy.textContent = '复制';
    copy.onclick = function(){
      function done(){ copy.textContent = '已复制'; setTimeout(function(){ copy.textContent = '复制'; }, 1500); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(u).then(done, done);
      } else {
        var ta = document.createElement('textarea');
        ta.value = u; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta); done();
      }
    };
    var go = document.createElement('a');
    go.className = 'mini go';
    go.textContent = '打开';
    go.href = u; go.target = '_blank'; go.rel = 'noopener noreferrer';
    row.appendChild(span); row.appendChild(copy); row.appendChild(go);
    list.appendChild(row);
  });
  document.getElementById('gluedPanel').classList.add('show');
})();
</script>
</body>
</html>
